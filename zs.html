
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something For You ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: "Poppins", Arial, sans-serif;
            background:
                radial-gradient(circle at 50% 40%, #32133d 0%, #160b24 45%, #080511 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Glow */
        body::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            background: #ff4f91;
            opacity: 0.12;
            filter: blur(120px);
            border-radius: 50%;
        }

        /* Main content */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .subtitle {
            color: rgba(255,255,255,0.75);
            font-size: 15px;
            letter-spacing: 4px;
            margin-bottom: 30px;
            animation: fadeIn 2s ease;
        }

        .love-btn {
            border: 1px solid rgba(255,255,255,0.25);
            padding: 22px 55px;
            border-radius: 60px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            color: white;
            font-size: 26px;
            font-weight: 500;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow:
                0 0 25px rgba(255,70,140,0.25),
                inset 0 0 20px rgba(255,255,255,0.05);
            transition: 0.4s ease;
            animation: buttonFloat 3s ease-in-out infinite;
        }

        .love-btn:hover {
            transform: scale(1.08);
            box-shadow:
                0 0 45px rgba(255,70,140,0.65),
                0 0 100px rgba(255,70,140,0.2);
            background: rgba(255,80,140,0.18);
        }

        .love-btn:active {
            transform: scale(0.95);
        }

        /* Stars */
        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 8px white;
            animation: twinkle 2s infinite ease-in-out;
        }

        .star:nth-child(1) { top: 10%; left: 12%; animation-delay: .2s; }
        .star:nth-child(2) { top: 20%; left: 80%; animation-delay: .8s; }
        .star:nth-child(3) { top: 65%; left: 15%; animation-delay: 1.2s; }
        .star:nth-child(4) { top: 75%; left: 85%; animation-delay: .5s; }
        .star:nth-child(5) { top: 35%; left: 30%; animation-delay: 1.5s; }
        .star:nth-child(6) { top: 15%; left: 55%; animation-delay: .9s; }
        .star:nth-child(7) { top: 85%; left: 45%; animation-delay: 1.7s; }
        .star:nth-child(8) { top: 45%; left: 92%; animation-delay: .3s; }
        .star:nth-child(9) { top: 90%; left: 8%; animation-delay: 1s; }
        .star:nth-child(10) { top: 55%; left: 65%; animation-delay: 1.4s; }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.2;
                transform: scale(0.6);
            }

            50% {
                opacity: 1;
                transform: scale(1.8);
            }
        }

        /* Hearts */
        .heart {
            position: absolute;
            bottom: -50px;
            color: #ff5c9a;
            font-size: 22px;
            opacity: 0;
            animation: floatHeart linear infinite;
            filter: drop-shadow(0 0 8px #ff4f91);
        }

        .heart:nth-of-type(1) {
            left: 10%;
            animation-duration: 8s;
            animation-delay: 1s;
        }

        .heart:nth-of-type(2) {
            left: 25%;
            animation-duration: 10s;
            animation-delay: 4s;
        }

        .heart:nth-of-type(3) {
            left: 45%;
            animation-duration: 7s;
            animation-delay: 2s;
        }

        .heart:nth-of-type(4) {
            left: 65%;
            animation-duration: 9s;
            animation-delay: 5s;
        }

        .heart:nth-of-type(5) {
            left: 82%;
            animation-duration: 8s;
            animation-delay: 3s;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(0) scale(0.5) rotate(0deg);
                opacity: 0;
            }

            15% {
                opacity: 0.8;
            }

            50% {
                transform: translateY(-50vh) scale(1) rotate(15deg);
                opacity: 0.7;
            }

            100% {
                transform: translateY(-115vh) scale(1.3) rotate(-15deg);
                opacity: 0;
            }
        }

        @keyframes buttonFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <!-- Stars -->
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>

    <!-- Floating Hearts -->
    <span class="heart">❤</span>
    <span class="heart">♡</span>
    <span class="heart">❤</span>
    <span class="heart">♡</span>
    <span class="heart">❤</span>

    <div class="container">

        <div class="subtitle">
            A LITTLE SOMETHING FOR YOU
        </div>

        <button class="love-btn" onclick="openLove()">
            Click Me ❤️
        </button>

    </div>

    <script>
        function openLove() {
            window.location.href = "love.html";
        }
    </script>

</body>
</html>
